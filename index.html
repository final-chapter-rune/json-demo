<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
  <!-- Google Fonts: Rubik 300/400/500 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Time tracking dashboard</title>

</head>
<body>

  <main class="Main">

    <div class="profile">
      <div class="id">
        <img src="images/image-jeremy.png" alt="">
        <p>Report for</p>
        <h1>Jeremy Robson</h1>
      </div>

      <ul class="switcher">         
        <li><button>Daily</button></li>
        <li><button>Weekly</button></li>
        <li><button>Monthly</button></li>
      </ul>
    </div>

    <article class="card card-work">
      <div class="card-head">
        <img src="images/icon-work.svg" alt="">
          <h2>Work</h2> 
          <button><img src="images/icon-ellipsis.svg" alt="Options"></button>
      </div>
      <p class="card-hours">32hrs</p> 
      <p class="card-previous">Previous - 36hrs</p> 

    </article>

    <article class="card card-play">
      <div class="card-head">
          <img src="images/icon-play.svg" alt="">
          <h2>Play</h2>
          <button><img src="images/icon-ellipsis.svg" alt="Options"></button>
      </div>
      <p class="card-hours">10hrs</p>
      <p class="card-previous">Previous - 8hrs</p>
    </article>

    <article class="card card-study">
      <div class="card-head">
          <img src="images/icon-study.svg" alt="">
          <h2>Study</h2>
          <button><img src="images/icon-ellipsis.svg" alt="Options"></button>
      </div>
      <p class="card-hours">4hrs</p>
      <p class="card-previous">Previous - 7hrs</p>
    </article>

    <article class="card card-exercise">
      <div class="card-head">
          <img src="images/icon-exercise.svg" alt="">
          <h2>Exercise</h2>
          <button><img src="images/icon-ellipsis.svg" alt="Options"></button>
      </div>
      <p class="card-hours">4hrs</p>
      <p class="card-previous">Previous - 5hrs</p>
    </article>

    <article class="card card-social">
      <div class="card-head">
          <img src="images/icon-social.svg" alt="">
          <h2>Social</h2>
          <button><img src="images/icon-ellipsis.svg" alt="Options"></button>
      </div>
      <p class="card-hours">5hrs</p>
      <p class="card-previous">Previous - 10hrs</p>
    </article>

    <article class="card card-self-care">
      <div class="card-head">
          <img src="images/icon-self-care.svg" alt="">
          <h2>Self Care</h2>
          <button><img src="images/icon-ellipsis.svg" alt="Options"></button>
      </div>
      <p class="card-hours">2hrs</p>
      <p class="card-previous">Previous - 2hrs</p>
    </article>
  </main>

</body>
</html>
